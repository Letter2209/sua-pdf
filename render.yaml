# Cấu hình triển khai lên Render (https://render.com) — gói Free: 0.1 CPU, 512 MB RAM,
# tự ngủ sau 15 phút không có người dùng, lần mở đầu tiên sau đó mất khoảng 1 phút.
services:
  - type: web
    name: sua-pdf
    runtime: python
    plan: free
    # cài thư viện rồi lập sẵn danh mục font để lần mở đầu tiên nhanh hơn
    buildCommand: pip install -r requirements.txt && python -c "import engine; engine.SYSFONTS._scan()"
    # 1 tiến trình (giữ phiên làm việc trong bộ nhớ), 4 luồng, cho phép xử lý ảnh lâu tới 5 phút
    startCommand: gunicorn -w 1 --threads 4 --timeout 300 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SUAPDF_SERVER
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
